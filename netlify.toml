# ── NETLIFY CONFIG ──
# Archivo de configuración para el despliegue en Netlify

[build]
  publish = "."        # La carpeta raíz contiene index.html directamente

# ── REDIRECTS ──
# Redirige HTTP a HTTPS automáticamente (Netlify también lo hace en el panel)
[[redirects]]
  from   = "http://damian-calderon-qa.netlify.app/*"
  to     = "https://damian-calderon-qa.netlify.app/:splat"
  status = 301
  force  = true

# Si se accede a una ruta inexistente, regresa al index (SPA fallback)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── HEADERS DE SEGURIDAD ──
# Complementa el archivo _headers — aquí queda como respaldo
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options            = "SAMEORIGIN"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=(), payment=()"

# Cache largo para assets estáticos (CSS, JS, imágenes)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El HTML nunca se cachea — siempre actualizado
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# El CV PDF se puede cachear moderadamente
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"
